<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kasir - Toko Wijaya Plastik</title>
<style>
:root{--hijau:#186b3a;--hijau2:#1f8f4d;--bg:#f4f6f4;--line:#e6eae6;--ink:#141a16;--muted:#6b7570}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;background:linear-gradient(180deg,var(--hijau2),var(--hijau));color:#fff;padding:12px 12px 10px;z-index:9;box-shadow:0 4px 14px rgba(16,60,34,.18)}
h1{font-size:15px;margin:0 0 10px;font-weight:700;letter-spacing:.2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tools{display:flex;gap:6px}
.tools button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:9px 12px;font-size:15px;min-width:40px;min-height:38px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;border:0;background:rgba(255,255,255,.14);color:#eaf5ee;border-radius:999px;padding:8px;font-size:13.5px;font-weight:600;transition:background .15s}
.tabs button.on{background:#fff;color:var(--hijau);font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.12)}
input#q{width:100%;font-size:17px;padding:12px 14px;border-radius:12px;border:0;outline:0;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.hint{font-size:12px;opacity:.92;margin-top:6px}
main{padding:12px 10px 148px;max-width:100vw}
.card{background:#fff;border-radius:14px;padding:11px 13px;margin-bottom:8px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,40,28,.04);cursor:pointer;transition:transform .06s ease, box-shadow .15s}
.card:active{transform:scale(.995);box-shadow:0 2px 10px rgba(20,40,28,.08)}
.n{font-size:15.5px;font-weight:700;line-height:1.25;word-break:break-word;letter-spacing:.1px}
.k{font-size:11.5px;color:var(--muted);margin-top:3px}
.p{font-size:16px;font-weight:800;color:var(--hijau);text-align:right;letter-spacing:.2px}
.d{font-size:11px;color:#6f7b74;text-align:right;margin-top:2px}
.rowi{display:flex;justify-content:space-between;align-items:center;gap:8px}
#toast{position:fixed;left:12px;right:12px;bottom:84px;background:#22302a;color:#fff;border-radius:12px;padding:10px 12px;display:none;align-items:center;gap:10px;font-size:13.5px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.22)}
#toast.on{display:flex}
#toast span{flex:1}
#toast button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:7px 11px;font-size:13px;font-weight:700}
.drill{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-top:1px dashed #e3e8e4;font-size:14px}
.drill:first-of-type{border-top:0}
.drill .rgt i{color:#6f7b74;font-style:normal;font-size:12px;margin-right:6px}
.drill:active{background:#f6f9f7}
.backb{border:0;background:#eef2ef;color:#2c3730;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;margin-right:6px}
.trx{border-top:1px dashed #e3e8e4;padding:9px 0}
.trxTop{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700}
.trxSub{font-size:12px;color:#6f7b74;margin-top:3px}
.delb{margin-top:6px;border:0;background:#fdecec;color:#b00;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.5}
#cartbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:20;box-shadow:0 -4px 18px rgba(20,40,28,.06)}
#cartbar .tot{flex:1;font-size:12px;color:var(--muted);line-height:1.2}
#cartbar .tot b{display:block;font-size:20px;color:var(--hijau);letter-spacing:.2px}
#cartbar button{border:0;border-radius:12px;padding:12px 16px;font-size:14.5px;font-weight:700;background:var(--hijau);color:#fff;box-shadow:0 2px 8px rgba(24,107,58,.25)}
#cartbar button.grey{background:#eef2ef;color:#2c3730;box-shadow:none}
#cartbar button[disabled]{background:#dfe6e1;color:#9aa8a0;box-shadow:none}
.sheet{background:#fff;border-radius:18px;padding:16px;max-width:560px;margin:0 auto;box-shadow:0 18px 40px rgba(12,30,20,.18)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40;padding:12px;overflow:auto}
.mask.on{display:block}
.sheet h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:12px;color:#555;margin:8px 0 3px}
.sheet input,.sheet select{width:100%;font-size:16px;padding:11px 12px;border:1px solid #d9e0da;border-radius:11px;color:var(--ink);background:#fff}
.sheet input:focus,.sheet select:focus{outline:2px solid rgba(31,143,77,.25);border-color:var(--hijau2)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts button{flex:1 1 auto;border:0;border-radius:12px;padding:12px;font-size:14.5px;font-weight:700;background:var(--hijau);color:#fff}
.acts button:active{transform:scale(.99)}
.acts button.grey{background:#eee;color:#333}
.acts button.red{background:#fdecec;color:#b00}
.ci{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed #e3e3e3}
.ci:first-child{border-top:0}
.ci .nm{flex:1;font-size:14px}
.ci .nm small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.ci .qt{display:flex;align-items:center;gap:6px}
.ci .qt button{width:30px;height:30px;border-radius:8px;border:0;background:#f1f1f1;font-size:16px;font-weight:700}
.ci .qt span{min-width:22px;text-align:center;font-weight:700}
.ci .hr{min-width:80px;text-align:right;font-weight:700;font-size:14px}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.45;background:#fff;color:#000;padding:10px;border:1px dashed #bbb;border-radius:8px;white-space:pre-wrap}
.tot2{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.tot2 b{font-size:16px}
.dhead{font-size:13px;color:#666;margin:10px 0 4px;font-weight:700}
@media print{
 body{background:#fff}
 header,#cartbar,main,.mask:not(.printing),.noprint{display:none !important}
 .mask.printing{position:static;display:block;background:#fff;padding:0}
 .mask.printing .sheet{box-shadow:none;max-width:100%;padding:0}
 .receipt{border:0;padding:0;font-size:11.5px}
}

/* ===== rekap v2 ===== */
#mRekap .sheet{max-height:90vh;overflow:auto}
.rkHero{background:linear-gradient(160deg,#0f7a55,#12694b);border-radius:16px;padding:14px 16px;color:#fff;box-shadow:0 6px 18px rgba(15,122,85,.22)}
.rkHero .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.rkHero .big{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.rkChips{display:flex;gap:8px;margin-top:12px}
.chip{flex:1;background:rgba(255,255,255,.16);border-radius:11px;padding:8px 10px}
.chip b{display:block;font-size:15px;font-weight:700}
.chip span{font-size:10.5px;opacity:.85}
.seg{display:flex;background:#eef2ef;border-radius:12px;padding:4px;margin:12px 0 8px}
.seg button{flex:1;border:0;background:transparent;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:#5d6862}
.seg button.on{background:#fff;color:#0f7a55;box-shadow:0 1px 3px rgba(0,0,0,.10)}
.rkRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 10px 12px 13px;background:#fff;border:1px solid #e7ece9;border-radius:12px;margin-bottom:8px}
.rkRow.tap{cursor:pointer}
.rkRow:active{transform:scale(.995)}
.rkRow .nm{font-size:14px;font-weight:600;color:#1d2621}
.rkRow .sub{font-size:11.5px;color:#8a948e;margin-top:2px}
.rkRow .amt{font-size:14px;font-weight:700;color:#0f7a55;font-variant-numeric:tabular-nums;white-space:nowrap}
.rkRow .chev{color:#c3ccc6;font-size:15px;margin-left:5px;line-height:1}
.trxCard{background:#fff;border:1px solid #e7ece9;border-radius:14px;padding:12px;margin-bottom:9px}
.trxCard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.trxCard .tm{font-size:13px;font-weight:700;color:#1d2621;font-variant-numeric:tabular-nums}
.trxCard .tot{font-size:15px;font-weight:800;color:#0f7a55;font-variant-numeric:tabular-nums}
.trxCard .who{display:inline-block;margin-top:6px;background:#eaf4ef;color:#0f7a55;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}
.trxCard ul{list-style:none;margin:8px 0 0;padding:0}
.trxCard li{font-size:12.5px;color:#4c574f;padding:3px 0;border-bottom:1px dashed #eef1ef}
.trxCard li:last-child{border:0}
.trxCard li b{color:#1d2621}
.delLink{margin-top:9px;border:0;background:#fdecea;color:#b3261e;font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;width:100%}
.rkBack{display:inline-flex;align-items:center;gap:6px;background:#eef2ef;border:0;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:#41504a;margin:2px 0 10px}
.rkHead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.rkHead .t{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7d8983}
.rkHead .s{font-size:12.5px;font-weight:700;color:#0f7a55;font-variant-numeric:tabular-nums}
.rkNote{font-size:12px;color:#8a948e;padding:10px 2px}
</style></head>
<body>
<header>
  <h1><span>Kasir &mdash; Toko Wijaya</span>
    <span class="tools"><button id="cfg">&#9881;</button></span>
  </h1>
  <div class="tabs"><button id="tabKasir" class="on">Kasir</button><button id="tabRekap">Rekap</button></div>
  <input id="q" placeholder="Ketik nama barang..." autocomplete="off" inputmode="search">
  <div class="hint" id="hint"></div>
</header>

<main id="list"></main>
<div id="toast"><span id="toastMsg"></span><button id="toastUndo">Batalkan</button></div>

<div id="cartbar">
  <div class="tot"><span id="ctext">Keranjang kosong</span><b id="ctotal">Rp 0</b></div>
  <button id="btnCart" class="grey">Keranjang</button>
  <button id="btnPay">Bayar</button>
</div>

<div class="mask" id="mItem"><div class="sheet">
  <h2 id="iTitle">Pilih ukuran</h2>
  <label>Ukuran</label>
  <select id="iSize"></select>
  <label>Jumlah</label>
  <input id="iQty" inputmode="numeric" value="1">
  <div class="acts"><button id="iAdd">Tambah</button><button id="iCancel" class="grey">Batal</button></div>
</div></div>

<div class="mask" id="mCart"><div class="sheet">
  <h2>Keranjang</h2>
  <div id="cartList"></div>
  <div class="tot2" style="margin-top:10px"><span>Total</span><b id="cartTotal">Rp 0</b></div>
  <div class="acts"><button id="cClose" class="grey">Tutup</button><button id="cClear" class="red">Kosongkan</button></div>
</div></div>

<div class="mask" id="mPay"><div class="sheet">
  <h2>Pembayaran</h2>
  <div class="tot2"><span>Total belanja</span><b id="payTotal">Rp 0</b></div>
  <label>Nama pelanggan (boleh dikosongkan)</label>
  <input id="payCust" list="custList" placeholder="cth: Bu Ani" autocomplete="off">
  <datalist id="custList"></datalist>
  <label>Uang diterima (Rp)</label>
  <input id="payCash" inputmode="numeric" placeholder="cth: 50000">
  <div class="tot2" style="margin-top:8px"><span>Kembalian</span><b id="payChange">Rp 0</b></div>
  <div id="payWarn" style="display:none;margin-top:8px;font-size:13px;color:#b00;font-weight:700"></div>
  <div class="acts"><button id="paySave">Simpan &amp; Struk</button><button id="payCancel" class="grey">Batal</button></div>
</div></div>

<div class="mask" id="mReceipt"><div class="sheet">
  <h2 class="noprint">Struk</h2>
  <div class="receipt" id="receiptText"></div>
  <div class="acts noprint"><button id="rPrint">Cetak</button><button id="rShare" class="grey">Bagikan</button><button id="rClose" class="grey">Tutup</button></div>
</div></div>

<div class="mask" id="mCfg"><div class="sheet">
  <h2>Pengaturan</h2>
  <label>URL data harga (baca) &mdash; opsional</label>
  <input id="fHarga" placeholder="https://script.google.com/macros/s/.../exec">
  <label>URL kasir (simpan transaksi) &mdash; wajib</label>
  <input id="fKasir" placeholder="https://script.google.com/macros/s/.../exec">
  <div class="acts"><button id="cfgSave">Simpan</button><button id="cfgTest" class="grey">Uji</button><button id="cfgClose" class="grey">Tutup</button></div>
  <p id="cfgMsg" style="font-size:12px;color:#555;margin-top:8px"></p>
</div></div>

<div class="mask" id="mRekap"><div class="sheet">
  <h2>Rekap penjualan</h2>
  <div class="tot2"><span>Tanggal</span><input id="rDate" type="date" style="width:auto;font-size:14px;padding:5px 8px"></div>
  <div id="rkCrumb" style="font-size:12.5px;color:#6f7b74;margin:8px 0 2px"></div>
  <div id="rekapBody" style="margin-top:6px"></div>
  <div class="acts"><button id="rkWa">Kirim ke WhatsApp</button><button id="rkDelDay" class="red">Hapus rekap tanggal ini</button><button id="rkClose" class="grey">Tutup</button></div>
</div></div>

const KEYC = 'tokoWijayaKasir_v1', KEYH = 'tokoWijayaHargaUrl', KEYK = 'tokoWijayaKasirUrl';
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Number(n||0).toLocaleString('id-ID');
const norm = s => String(s).toLowerCase().replace(/asi|asy|asoi|aoy|ampua/g,'asoy').replace(/[^a-z0-9 ]/g,' ');

let ITEMS = BASE.slice(), CART = [], pickItem = null, CACHE_TRX = [];

function saveCart(){ try{ localStorage.setItem(KEYC, JSON.stringify(CART)); }catch(e){} }
function loadCart(){ try{ CART = JSON.parse(localStorage.getItem(KEYC)||'[]') || []; }catch(e){ CART=[]; } }
loadCart();

function renderList(filter){
  const f = norm(filter||'').trim().split(/\s+/).filter(Boolean);
  const out = ITEMS.filter(it=>{
    const hay = norm(it.nama + ' ' + (it.sizes||[]).map(s=>s.u).join(' ') + ' ' + (it.ket||''));
    return f.every(w=> hay.includes(w));
  });
  $('hint').textContent = out.length + ' barang';
  if(!out.length){ $('list').innerHTML = '<div class="empty">Barang tidak ditemukan.</div>'; return; }
  $('list').innerHTML = out.map((it,i)=>{
    const s0 = (it.sizes||[])[0] || {u:'', j1:0};
    const multi = (it.sizes||[]).length > 1;
    const label = multi ? ((it.sizes||[]).length + ' ukuran') : (s0.u || '');
    return '<div class="card" data-i="'+ITEMS.indexOf(it)+'"><div class="rowi"><div><div class="n">'+it.nama+'</div>'+
      '<div class="k">'+(it.ket||'')+(label?' &middot; '+label:'')+'</div></div>'+
      '<div><div class="p">'+rp(s0.j1)+'</div>'+(s0.m?'<div class="d">modal '+rp(s0.m)+'</div>':'')+'</div></div></div>';
  }).join('');
}

function renderCart(){
  const total = CART.reduce((a,c)=> a + c.harga*c.qty, 0);
  const n = CART.reduce((a,c)=> a + c.qty, 0);
  $('ctext').textContent = n ? (n + ' barang') : 'Keranjang kosong';
  $('ctotal').textContent = rp(total);
  $('btnPay').disabled = !CART.length;
  $('btnCart').textContent = n ? ('Keranjang (' + n + ')') : 'Keranjang';
  $('cartTotal').textContent = rp(total);
  if(!CART.length){ $('cartList').innerHTML = '<div class="empty">Belum ada barang.</div>'; return; }
  $('cartList').innerHTML = CART.map((c,i)=>(
    '<div class="ci"><div class="nm">'+c.nama+'<small>'+c.ukuran+(c.modal?' &middot; modal '+rp(c.modal):'')+'</small></div>'+
    '<div class="qt"><button data-dec="'+i+'">&minus;</button><span>'+c.qty+'</span><button data-inc="'+i+'">+</button></div>'+
    '<div class="hr">'+rp(c.harga*c.qty)+'</div></div>'
  )).join('');
}

$('list').addEventListener('click', e=>{
  const c = e.target.closest('.card'); if(!c) return;
  const it = ITEMS[Number(c.dataset.i)];
  const sizes = it.sizes && it.sizes.length ? it.sizes : [{u:'', j1:0, m:null}];
  if(sizes.length === 1){ addToCart(it, sizes[0], 1); return; }
  pickItem = it;
  $('iTitle').textContent = it.nama;
  $('iSize').innerHTML = sizes.map((s,k)=>'<option value="'+k+'">'+(s.u||'-')+' &middot; '+rp(s.j1)+'</option>').join('');
  $('iQty').value = 1;
  $('mItem').classList.add('on');
});

let undoFn = null, undoTimer = null;
function showToast(msg, fn){
  undoFn = fn || null;
  $('toastMsg').textContent = msg;
  $('toastUndo').style.display = fn ? 'block' : 'none';
  $('toast').classList.add('on');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(()=>{ $('toast').classList.remove('on'); undoFn=null; }, 4000);
}
$('toastUndo').addEventListener('click', ()=>{
  if(undoFn) undoFn();
  undoFn = null; $('toast').classList.remove('on'); renderCart();
});

function addToCart(it, size, qty){
  const key = it.nama + '|' + (size.u||'');
  const found = CART.find(c=> c.key===key);
  if(found) found.qty += qty;
  else CART.push({key, nama:it.nama, ukuran:size.u||'', harga:size.j1, modal:size.m, qty});
  saveCart(); renderCart();
  showToast(it.nama + (size.u? ' ('+size.u+')':'') + ' masuk keranjang', ()=>{
    const f = CART.find(c=>c.key===key);
    if(f){ f.qty -= qty; if(f.qty<=0) CART.splice(CART.indexOf(f),1); }
    saveCart();
  });
}

$('iAdd').addEventListener('click', ()=>{
  if(!pickItem) return;
  const k = Number($('iSize').value)||0;
  const q = Math.max(1, Number(String($('iQty').value).replace(/[^0-9]/g,''))||1);
  addToCart(pickItem, pickItem.sizes[k], q);
  $('mItem').classList.remove('on'); pickItem = null;
});
$('iCancel').addEventListener('click', ()=> $('mItem').classList.remove('on'));

$('cartList').addEventListener('click', e=>{
  const inc = e.target.dataset.inc, dec = e.target.dataset.dec;
  if(inc!=null){ CART[Number(inc)].qty++; saveCart(); renderCart(); }
  if(dec!=null){ const i=Number(dec); CART[i].qty--; if(CART[i].qty<=0) CART.splice(i,1); saveCart(); renderCart(); }
});

$('btnCart').addEventListener('click', ()=>{ renderCart(); $('mCart').classList.add('on'); });
$('cClose').addEventListener('click', ()=> $('mCart').classList.remove('on'));
$('cClear').addEventListener('click', ()=>{
  if(!CART.length) return;
  if(!confirm('Kosongkan keranjang?')) return;
  CART = []; saveCart(); renderCart(); $('mCart').classList.remove('on');
});

$('btnPay').addEventListener('click', ()=>{
  if(!CART.length){ alert('Keranjang masih kosong.'); return; }
  const total = CART.reduce((a,c)=> a + c.harga*c.qty, 0);
  $('payTotal').textContent = rp(total);
  $('payCash').value = '';
  $('payCust').value = '';
  const names = [...new Set(RK.concat(CACHE_TRX).map(x=> x.customer || 'Umum'))].filter(n=> n && n !== 'Umum').sort();
  $('custList').innerHTML = names.map(n=>'<option value="'+n+'">').join('');
  refreshPay();
  $('mPay').classList.add('on');
});
function totals(){ return CART.reduce((a,c)=> a + c.harga*c.qty, 0); }
function cashNow(){ return Number(String($('payCash').value).replace(/[^0-9]/g,''))||0; }
function refreshPay(){
  const total = totals(), cash = cashNow();
  const kurang = cash > 0 && cash < total;
  $('payChange').textContent = rp(cash ? Math.max(0, cash-total) : 0);
  $('payWarn').style.display = kurang ? 'block' : 'none';
  $('payWarn').textContent = kurang ? ('Uang kurang ' + rp(total-cash) + ' — transaksi belum bisa disimpan.') : '';
  $('paySave').disabled = kurang;
  $('paySave').style.opacity = kurang ? .5 : 1;
}
$('payCash').addEventListener('input', refreshPay);
$('payCancel').addEventListener('click', ()=> $('mPay').classList.remove('on'));

function nowWIB(){
  const d = new Date();
  return { tanggal: d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'}),
           jam: d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}),
           iso: d.toISOString() };
}
function trxId(){ const d=new Date(); return 'T'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(Math.floor(Math.random()*9000)+1000); }

$('paySave').addEventListener('click', async ()=>{
  const t = nowWIB();
  const total = CART.reduce((a,c)=> a + c.harga*c.qty, 0);
  const cash = cashNow();
  if(cash > 0 && cash < total){ alert('Uang diterima kurang ' + rp(total-cash) + '. Transaksi dibatalkan.'); return; }
  const cust = ($('payCust').value || '').trim() || 'Umum';
  const trx = {
    id: trxId(), tanggal: t.tanggal, jam: t.jam, iso: t.iso, customer: cust,
    items: CART.map(c=>({nama:c.nama, ukuran:c.ukuran, qty:c.qty, harga:c.harga, modal:c.modal||0, subtotal:c.harga*c.qty})),
    total, bayar: cash||total, kembali: Math.max(0,(cash||total)-total)
  };
  showReceipt(trx);
  $('mPay').classList.remove('on');
  if(KURL){
    try{
      await fetch(KURL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(trx)});
    }catch(e){ alert('Transaksi tersimpan di HP, tapi gagal kirim ke Sheet. Cek internet/URL kasir.'); }
  } else {
    alert('URL kasir belum diisi (tombol ⚙). Transaksi hanya tersimpan di HP ini.');
  }
  CART = []; saveCart(); renderCart();
});

function showReceipt(trx){
  const lines = [];
  lines.push('TOKO WIJAYA PLASTIK');
  lines.push('==============================');
  lines.push(trx.id);
  lines.push(trx.tanggal + ' ' + trx.jam);
  if(trx.customer && trx.customer !== 'Umum') lines.push('Pelanggan: ' + trx.customer);
  lines.push('------------------------------');
  trx.items.forEach(it=>{
    lines.push(it.nama + (it.ukuran? ' ('+it.ukuran+')':''));
    lines.push('  ' + it.qty + ' x ' + rp(it.harga) + ' = ' + rp(it.subtotal));
  });
  lines.push('------------------------------');
  lines.push('TOTAL   : ' + rp(trx.total));
  lines.push('BAYAR   : ' + rp(trx.bayar));
  lines.push('KEMBALI : ' + rp(trx.kembali));
  lines.push('==============================');
  lines.push('Terima kasih');
  $('receiptText').textContent = lines.join('\n');
  $('mReceipt').classList.add('on');
}
$('rClose').addEventListener('click', ()=> $('mReceipt').classList.remove('on'));
$('rPrint').addEventListener('click', ()=>{
  $('mReceipt').classList.add('printing');
  window.print();
  setTimeout(()=> $('mReceipt').classList.remove('printing'), 500);
});
$('rShare').addEventListener('click', ()=>{
  const txt = $('receiptText').textContent;
  if(navigator.share){ navigator.share({text: txt}).catch(()=>{}); }
  else { alert('Tekan lama teks struk untuk menyalin.'); }
});

}
$('rkClose').addEventListener('click', showKasir);
$('rDate').addEventListener('change', ()=>{ rkHour=null; rkMin=null; rkCust=null; loadRekap(); });

let RK = [], rkHour = null, rkMin = null, rkCust = null, rkSeg = 'cust';

function hms(t){
  const p = String(t||'').replace(/\./g,':').split(':').map(x=>String(x).padStart(2,'0'));
  return { h: p[0]||'--', m: p[1]||'--', s: p[2]||'--' };
}
function tglKey(){
  const d = $('rDate').value.split('-');
  return d[2]+'/'+d[1]+'/'+d[0];
}
function pcs(rows){
  let n = 0;
  rows.forEach(x=> (x.items||[]).forEach(i=> n += Number(i.qty||0)));
  return n;
}
async function loadRekap(){
  const box = $('rekapBody');
  if(!KURL){ box.innerHTML = '<div class="empty">URL kasir belum diisi. Buka &#9881; dulu.</div>'; return; }
  box.innerHTML = '<div class="empty">Memuat...</div>';
  try{
    const r = await fetch(KURL + (KURL.includes('?')?'&':'?') + 't=' + Date.now());
    const all = await r.json();
    CACHE_TRX = Array.isArray(all)? all : [];
    RK = CACHE_TRX.filter(x=> x.tanggal === tglKey());
    renderRekap();
  }catch(e){
    box.innerHTML = '<div class="empty">Gagal memuat. Cek internet / URL kasir.</div>';
  }
}

function custAgg(rows){
  const o = {};
  rows.forEach(x=>{
    const c = x.customer || 'Umum';
    o[c] = o[c] || {n:0, t:0};
    o[c].n++; o[c].t += Number(x.total||0);
  });
  return o;
}

function rkCard(rows){
  const om = rows.reduce((a,x)=> a + Number(x.total||0), 0);
  const agg = custAgg(rows);
  return '<div class="rkHero">'+
    '<div class="lbl">Omzet tanggal ini</div>'+
    '<div class="big">'+rp(om)+'</div>'+
    '<div class="rkChips">'+
      '<div class="chip"><b>'+rows.length+'</b><span>transaksi</span></div>'+
      '<div class="chip"><b>'+pcs(rows)+'</b><span>barang (pcs)</span></div>'+
      '<div class="chip"><b>'+Object.keys(agg).length+'</b><span>pelanggan</span></div>'+
    '</div>'+
  '</div>';
}

function rkTrxCard(x){
  const t = hms(x.jam);
  const isi = (x.items||[]).map(i=>
    '<li><b>'+i.qty+'x</b> '+i.nama+(i.ukuran? ' <span style="color:#8a948e">&middot; '+i.ukuran+'</span>':'')+
    ' <span style="float:right;color:#4c574f">'+rp(Number(i.qty||0)*Number(i.harga||0))+'</span></li>').join('');
  return '<div class="trxCard">'+
    '<div class="top"><span class="tm">'+String(x.jam||'')+'</span><span class="tot">'+rp(x.total)+'</span></div>'+
    '<div class="who">'+(x.customer || 'Umum')+'</div>'+
    '<ul>'+isi+'</ul>'+
    '<button class="delLink" data-del="'+x.id+'">Hapus transaksi ini</button>'+
  '</div>';
}

function renderRekap(){
  const box = $('rekapBody'), crumb = $('rkCrumb');
  $('rkDelDay').style.display = (rkHour || rkCust)? 'none' : 'block';
  crumb.innerHTML = '';

  // ---- rincian per pelanggan ----
  if(rkCust){
    const inC = RK.filter(x=> (x.customer||'Umum') === rkCust)
                  .sort((a,b)=> String(a.jam).localeCompare(String(b.jam)));
    const omc = inC.reduce((a,x)=> a + Number(x.total||0), 0);
    box.innerHTML =
      '<button class="rkBack" data-back="3">&#8249; Semua pelanggan</button>'+
      '<div class="rkHead"><span class="t">'+rkCust+'</span><span class="s">'+inC.length+' trx &middot; '+rp(omc)+'</span></div>'+
      (inC.length? inC.map(rkTrxCard).join('') : '<div class="rkNote">Tidak ada transaksi.</div>');
    return;
  }

  // ---- rincian dalam 1 jam (per menit) ----
  if(rkHour && !rkMin){
    const inHour = RK.filter(x=> hms(x.jam).h === rkHour)
                     .sort((a,b)=> String(a.jam).localeCompare(String(b.jam)));
    const om = inHour.reduce((a,x)=> a + Number(x.total||0), 0);
    box.innerHTML =
      '<button class="rkBack" data-back="1">&#8249; Ringkasan</button>'+
      '<div class="rkHead"><span class="t">Jam '+rkHour+'</span><span class="s">'+inHour.length+' trx &middot; '+rp(om)+'</span></div>'+
      inHour.map(rkTrxCard).join('');
    return;
  }

  // ---- ringkasan tanggal ----
  if(!RK.length){
    box.innerHTML = rkCard(RK) + '<div class="rkNote">Belum ada transaksi tanggal ini.</div>';
    return;
  }

  const agg = custAgg(RK);
  const perJam = {};
  RK.forEach(x=>{
    const h = hms(x.jam).h;
    perJam[h] = perJam[h] || {n:0, t:0};
    perJam[h].n++; perJam[h].t += Number(x.total||0);
  });

  const listCust = Object.keys(agg).sort().map(c=>
    '<div class="rkRow tap" data-c="'+c+'">'+
      '<div><div class="nm">'+c+'</div><div class="sub">'+agg[c].n+' transaksi</div></div>'+
      '<div style="display:flex;align-items:center"><span class="amt">'+rp(agg[c].t)+'</span><span class="chev">&#8250;</span></div>'+
    '</div>').join('');

  const listJam = Object.keys(perJam).sort().map(h=>
    '<div class="rkRow tap" data-h="'+h+'">'+
      '<div><div class="nm">Jam '+h+':00</div><div class="sub">'+perJam[h].n+' transaksi</div></div>'+
      '<div style="display:flex;align-items:center"><span class="amt">'+rp(perJam[h].t)+'</span><span class="chev">&#8250;</span></div>'+
    '</div>').join('');

  box.innerHTML = rkCard(RK)+
    '<div class="seg">'+
      '<button data-seg="cust" class="'+(rkSeg==='cust'?'on':'')+'">Per pelanggan</button>'+
      '<button data-seg="jam" class="'+(rkSeg==='jam'?'on':'')+'">Per jam</button>'+
    '</div>'+
    (rkSeg==='cust'? listCust : listJam);
}

$('rekapBody').addEventListener('click', e=>{
  const seg = e.target.closest('[data-seg]');
  if(seg){ rkSeg = seg.dataset.seg; renderRekap(); return; }
  const c = e.target.closest('[data-c]');
  if(c){ rkCust = c.dataset.c; rkHour = null; rkMin = null; renderRekap(); return; }
  const h = e.target.closest('[data-h]');
  if(h){ rkHour = h.dataset.h; rkMin = null; renderRekap(); return; }
  const del = e.target.closest('[data-del]');
  if(del) hapusTrx(del.dataset.del);
});
$('rkCrumb').addEventListener('click', e=>{
  const b = e.target.closest('[data-back]');
  if(!b) return;
  rkCust = null; rkHour = null; rkMin = null;
  renderRekap();
});
$('rekapBody').addEventListener('click', ()=>{});

function rekapWA(){
  const omzet = RK.reduce((a,x)=> a + Number(x.total||0), 0);
  const agg = custAgg(RK);
  let t = '*REKAP TOKO WIJAYA*\n' + tglKey() + '\n';
  t += '------------------------\n';
  t += 'Transaksi : ' + RK.length + '\n';
  t += 'Omzet     : ' + rp(omzet) + '\n';
  if(RK.length){
    t += '------------------------\n*Per pelanggan*\n';
    Object.keys(agg).sort().forEach(c=>{ t += '- ' + c + ': ' + agg[c].n + 'x, ' + rp(agg[c].t) + '\n'; });
    const bar = {};
    RK.forEach(x=> (x.items||[]).forEach(i=>{
      const k = i.nama + (i.ukuran? ' ('+i.ukuran+')':'');
      bar[k] = (bar[k]||0) + Number(i.qty||0);
    }));
    t += '------------------------\n*Barang terjual*\n';
    Object.keys(bar).sort().forEach(k=>{ t += '- ' + k + ': ' + bar[k] + '\n'; });
  } else {
    t += '\nBelum ada transaksi.';
  }
  return t;
}
$('rkWa').addEventListener('click', ()=>{
  window.open('https://wa.me/?text=' + encodeURIComponent(rekapWA()), '_blank');
});

$('rkDelDay').addEventListener('click', async ()=>{
  if(!RK.length){ alert('Tidak ada transaksi tanggal ini.'); return; }
  if(!KURL){ alert('URL kasir belum diisi.'); return; }
  if(!confirm('Hapus SEMUA ' + RK.length + ' transaksi tanggal ' + tglKey() + '?')) return;
  if(!confirm('Yakin? Data di Sheet akan dihapus permanen.')) return;
  try{
    await fetch(KURL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'hapusTanggal', tanggal: tglKey()})});
    rkHour = null; rkMin = null; rkCust = null;
    await loadRekap();
    if(RK.length === 0) alert('Rekap tanggal ' + tglKey() + ' sudah dihapus.');
    else alert('Gagal menghapus ('+RK.length+' transaksi masih ada).\n\nPenyebab: skrip di Sheet masih versi lama.\nPerbaiki: Extensions > Apps Script > tempel apps_script_kasir.gs > Deploy > Manage deployments > pensil > New version > Deploy.');
  }catch(e){ alert('Gagal menghapus. Cek internet / URL kasir.'); }
});

async function hapusTrx(id){
  if(!confirm('Hapus transaksi ' + id + '?')) return;
  if(!KURL){ alert('URL kasir belum diisi.'); return; }
  try{
    const res = await fetch(KURL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'hapus', id:id})});
    const balas = (await res.text().catch(()=> '')).slice(0,140);
    await loadRekap();
    const masih = CACHE_TRX.some(x=> String(x.id) === String(id));
    if(masih){
      alert('Transaksi BELUM terhapus.\n\nBalasan server:\n' + (balas || '(kosong)') +
        '\n\nArtinya URL /exec yang dipakai app masih menjalankan skrip LAMA.');
    } else {
      alert('Transaksi ' + id + ' sudah dihapus.');
    }
  }catch(e){ alert('Gagal menghapus. Cek internet / URL kasir.'); }
}

async function loadItemsFromSheet(){
  try{
    const r = await fetch(HURL + (HURL.includes('?')?'&':'?') + 't=' + Date.now());
    const arr = await r.json();
    if(Array.isArray(arr) && arr.length){
      ITEMS = arr.map(it=>({nama: it.nama, ket: it.ket||'', sizes: (it.sizes||[]).map(s=>({u:s.u, m:(s.m!=null? s.m : null), j1:s.j1}))}));
      renderList('');
    }
  }catch(e){}
}
